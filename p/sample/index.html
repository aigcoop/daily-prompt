<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 프롬프트 견본 | AI로사쌤</title>
<meta property="og:title" content="오늘의 프롬프트 | AI로사쌤">
<meta property="og:description" content="사진 속 이미지를 만드는 프롬프트를 한 번에 복사하세요.">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 배치: 휴대폰 한 줄 세로 흐름 — 날짜 띠 → 사진 → 제목 → 프롬프트 상자 → 큰 복사 단추 */
:root{
  --bg:#eef4f1;
  --card:#ffffff;
  --ink:#16302b;
  --soft:#5b716c;
  --line:#cfdcd7;
  --accent:#0c7a66;
  --accent-ink:#ffffff;
  --mark:#ffe27a;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101b19;--card:#182724;--ink:#e6f1ee;--soft:#9db3ad;--line:#2c403b;
    --accent:#3fc4a8;--accent-ink:#06211c;--mark:#6b5a12;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101b19;--card:#182724;--ink:#e6f1ee;--soft:#9db3ad;--line:#2c403b;
  --accent:#3fc4a8;--accent-ink:#06211c;--mark:#6b5a12;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.day{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:8px}
.day b{font-family:var(--display);font-weight:400;font-size:20px}
.day span{color:var(--soft);font-size:15px}
figure{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
figure svg,figure img{display:block;width:100%;height:auto;max-width:100%}
figcaption{padding:8px 12px;color:var(--soft);font-size:14px}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.3;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--mark) 58%)}
.how{margin:0;color:var(--soft)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
  white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:16px}
button{font-family:var(--display);font-size:21px;border:0;border-radius:14px;padding:16px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:active{transform:translateY(1px)}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}
#msg{margin:0;min-height:1.6em;text-align:center;color:var(--accent);font-size:15px}
</style>
</head>
<body>
<main>
  <div class="day"><b>오늘의 프롬프트</b><span>AI로사쌤 · 견본</span></div>

  <figure>
    <svg viewBox="0 0 520 390" role="img" aria-label="예시 사진이 들어갈 자리">
      <rect width="520" height="390" fill="#dcebe5"/>
      <rect y="250" width="520" height="140" fill="#b98a5e"/>
      <ellipse cx="260" cy="292" rx="150" ry="22" fill="#9a6f47"/>
      <path d="M160 170h200v60a100 70 0 0 1-200 0z" fill="#ffffff"/>
      <ellipse cx="260" cy="170" rx="100" ry="20" fill="#f3f7f5"/>
      <ellipse cx="260" cy="172" rx="86" ry="14" fill="#a8672f"/>
      <path d="M360 185c48-6 48 58 2 52" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
      <path d="M232 138c-14-22 14-30 0-54M270 138c-14-22 14-30 0-54" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    </svg>
    <figcaption>견본 그림이에요. 실제로는 직접 만드신 예시 사진이 여기에 들어가요.</figcaption>
  </figure>

  <h1>창가 햇살 아래 <em>따뜻한 보리차 한 잔</em></h1>
  <p class="how">아래 단추를 눌러 복사한 뒤, 제미나이나 챗GPT 대화창에 붙여넣으면 돼요.</p>

  <div class="box" id="prompt">아침 햇살이 들어오는 나무 식탁 위에 놓인 흰 도자기 찻잔, 잔 안에는 김이 모락모락 오르는 따뜻한 보리차. 찻잔 옆에는 볶은 보리 알갱이가 담긴 작은 나무 접시. 창가에서 비스듬히 들어오는 부드러운 자연광, 얕은 심도, 실제 사진처럼 사실적인 질감, 4:3 비율, 글자 없음.</div>

  <button type="button" id="copy">프롬프트 복사</button>
  <p id="msg" role="status" aria-live="polite"></p>
  <p class="how" style="text-align:center;font-size:14px">출처 · AI로사쌤</p>
</main>
<script>
(function(){
  var btn=document.getElementById('copy'),box=document.getElementById('prompt'),msg=document.getElementById('msg');
  function done(){btn.textContent='복사됐어요';msg.textContent='이제 대화창에 붙여넣기 하세요.';
    setTimeout(function(){btn.textContent='프롬프트 복사'},2500)}
  function fallback(){
    try{
      var r=document.createRange();r.selectNodeContents(box);
      var s=window.getSelection();s.removeAllRanges();s.addRange(r);
      if(document.execCommand('copy')){done()}
      else{msg.textContent='글이 선택됐어요. 길게 눌러 복사를 눌러 주세요.'}
    }catch(e){msg.textContent='프롬프트 글을 길게 눌러 복사해 주세요.'}
  }
  btn.addEventListener('click',function(){
    var t=box.textContent;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done).catch(fallback);
    }else{fallback()}
  });
})();
</script>
</body>
</html>
